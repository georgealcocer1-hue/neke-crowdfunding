function recordTransaction(type, project, amount) {
    const record = {
        projectId: project.id,
        projectTitle: project.title,
        amount: amount,
        date: new Date().toLocaleDateString('es-EC')
    };
    if (type === 'donate') {
        currentUser.donations.push(record);
    } else {
        currentUser.investments.push(record);
    }
    localStorage.setItem('nekeUser', JSON.stringify(currentUser));
}

function extractYTId(url) {
    if (!url) return '';
    url = url.trim();
    
    if (/^[a-zA-Z0-9_-]{11}$/.test(url)) {
        return url;
    }
    
    const patterns = [
        /(?:youtube\.com\/watch\?.*v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
        /([a-zA-Z0-9_-]{11})/
    ];
    
    for (let p of patterns) {
        const m = url.match(p);
        if (m && m[1] && /^[a-zA-Z0-9_-]{11}$/.test(m[1])) {
            return m[1];
        }
    }
    
    return '';
}

function extractTikTokId(url) {
    if (!url) return '';
    url = url.trim();

    const m = url.match(/tiktok\.com\/@[^/]+\/video\/(\d+)/);
    if (m) return m[1];

    if (/^\d{15,20}$/.test(url)) return url;

    return '';
}

function extractVideoInfo(url) {
    if (!url) return { platform: null, id: '' };
    url = url.trim();

    if (url.includes('tiktok.com')) {
        return { platform: 'tiktok', id: extractTikTokId(url) };
    }

    if (/^\d{15,20}$/.test(url)) {
        return { platform: 'tiktok', id: url };
    }

    return { platform: 'youtube', id: extractYTId(url) };
}

function getPlatform(p) {
    return p.platform || 'youtube';
}

function getVideoId(p) {
    return p.videoId || p.ytId || '';
}

function testVideoUrl() {
    const url = document.getElementById('ytUrl').value;
    const { platform, id } = extractVideoInfo(url);
    const status = document.getElementById('ytStatus');
    const submitBtn = document.getElementById('submitBtn');

    if (!url) {
        status.style.display = 'none';
        submitBtn.disabled = false;
        return;
    }

    if (!id) {
        status.style.display = 'block';
        status.textContent = platform === 'tiktok'
            ? '❌ No se pudo leer el ID. Usa el link completo de TikTok (tiktok.com/@usuario/video/...), los links cortos vm.tiktok.com no funcionan.'
            : '❌ ID inválido. Pega una URL válida de YouTube.';
        status.style.background = '#FEE2E2';
        status.style.borderColor = '#DC2626';
        status.style.color = '#7F1D1D';
        submitBtn.disabled = true;
        return;
    }

    status.style.display = 'block';
    status.style.background = '#D1FAE5';
    status.style.borderColor = '#059669';
    status.style.color = '#065F46';
    status.textContent = (platform === 'tiktok' ? '✅ TikTok válido: ' : '✅ YouTube válido: ') + id;
    submitBtn.disabled = false;
}

let currentFilter = 'all';
let filteredProjects = [];

function filterCategory(cat, evt) {
    currentFilter = cat;
    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
    if (evt) evt.target.classList.add('active');
    applyFilter();
}

function applyFilter() {
    filteredProjects = currentFilter === 'all' ? [...projects] : projects.filter(p => p.category === currentFilter);
    render();
}

function render() {
    if (filteredProjects.length === 0) {
        document.getElementById('feed').innerHTML = `
            <div class="card">
                <div style="color: white; text-align: center; padding: 20px;">
                    <div style="font-size: 40px; margin-bottom: 12px;">📭</div>
                    <div style="font-size: 16px; font-weight: 600; margin-bottom: 6px;">No hay proyectos disponibles</div>
                    <div style="font-size: 13px; opacity: 0.7;">${currentFilter === 'all' ? 'Aún no se ha agregado ningún proyecto.' : 'No hay proyectos en esta categoría.'}</div>
                </div>
            </div>
        `;
        return;
    }

    const html = filteredProjects.map((p, idx) => {
        const platform = getPlatform(p);
        const vid = getVideoId(p);
        const videoEmbed = platform === 'tiktok'
            ? `<iframe id="yt-player-${p.id}" src="https://www.tiktok.com/embed/v2/${vid}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen loading="lazy"></iframe>`
            : `<iframe id="yt-player-${p.id}" src="https://www.youtube.com/embed/${vid}?rel=0&mute=1&loop=1&playlist=${vid}&enablejsapi=1&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;

        return `
        <div class="card" data-project-id="${p.id}" data-platform="${platform}">
            <div class="video-container">
                ${videoEmbed}
            </div>
            <div class="info">
                <div class="title">
                    <span>${p.title}</span>
                    <button class="title-plus" onclick="openInfo(${p.id})" title="Más información">+</button>
                </div>
                <div class="creator">por ${p.creator}</div>
                <div class="stats-row">
                    <div class="stat">
                        <div class="stat-value">$${(p.raised/1000).toFixed(0)}K</div>
                        <div>Recaudado</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">${Math.round(p.raised/p.goal*100)}%</div>
                        <div>Meta</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">${p.days}d</div>
                        <div>Restantes</div>
                    </div>
                </div>
            </div>
            <div class="controls">
                <button class="control-btn" onclick="openInvest(${p.id})" title="Donar/Invertir">💰</button>
                <button class="control-btn" onclick="shareProject(${p.id})" title="Compartir">↗</button>
            </div>
        </div>
        `;
    }).join('');

    document.getElementById('feed').innerHTML = html;
    setupFeedObserver();
}

function ytCommand(iframe, func) {
    if (!iframe || !iframe.contentWindow) return;
    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args: [] }), '*');
}

let feedObserver = null;

function setupFeedObserver() {
    if (feedObserver) feedObserver.disconnect();

    const cards = document.querySelectorAll('.card');
    feedObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.target.dataset.platform !== 'youtube') return;
            const iframe = entry.target.querySelector('iframe');
            ytCommand(iframe, entry.isIntersecting ? 'playVideo' : 'pauseVideo');
        });
    }, { threshold: 0.6 });

    cards.forEach(c => feedObserver.observe(c));
}

                <div style="margin-bottom: 4px;"><strong>Categoría:</strong> ${p.category.toUpperCase()}</div>

function closeInfo() {
    document.getElementById('infoModal').classList.remove('active');
}

function openInvest(id) {
    const p = projects.find(x => x.id === id);
    currentProject = p;
    investType = null;
    document.getElementById('investSheet').classList.add('active');
}

function closeInvest() {
    document.getElementById('investSheet').classList.remove('active');
    currentProject = null;
    investType = null;
}

function selectInvestType(type) {
    investType = type;
    
    const amounts = type === 'donate' 
        ? [50, 100, 500, 1000]
        : [1000, 5000, 10000, 25000];

    const html = `
        <div style="margin-bottom: 16px;">
            <div style="font-size: 12px; color: #666; margin-bottom: 8px;">
                ${type === 'donate' ? 'Selecciona monto a donar:' : 'Selecciona monto a invertir:'}
            </div>
            <div class="invest-amount">
                ${amounts.map(amt => `
                    <button type="button" class="amount-btn" onclick="selectAmount(${amt}, event)">$${amt}</button>
                `).join('')}
            </div>
        </div>

        <div class="form-group">
            <label>Otro monto ($)</label>
            <input type="number" id="customAmount" placeholder="Ingresa monto personalizado" min="1">
        </div>

        <button type="button" class="btn-submit" onclick="confirmInvestment()">
            ${type === 'donate' ? '✅ Confirmar Donación' : '✅ Confirmar Inversión'}
        </button>
    `;

    document.getElementById('investContent').innerHTML = html;
}

function selectInvestTypeFromModal(type, id) {
    const p = projects.find(x => x.id === id);
    currentProject = p;
    investType = type;
    
    const amounts = type === 'donate' 
        ? [50, 100, 500, 1000]
        : [1000, 5000, 10000, 25000];

    const html = `
        <div style="margin-bottom: 16px;">
            <div style="font-size: 12px; color: #666; margin-bottom: 8px;">
                ${type === 'donate' ? 'Selecciona monto a donar:' : 'Selecciona monto a invertir:'}
            </div>
            <div class="invest-amount">
                ${amounts.map(amt => `
                    <button type="button" class="amount-btn" onclick="selectAmountFromModal(${amt}, event)">$${amt}</button>
                `).join('')}
            </div>
        </div>

        <div class="form-group">
            <label>Otro monto ($)</label>
            <input type="number" id="customAmount" placeholder="Ingresa monto personalizado" min="1">
        </div>

        <button type="button" class="btn-submit" onclick="confirmInvestmentFromModal()">
            ${type === 'donate' ? '✅ Confirmar Donación' : '✅ Confirmar Inversión'}
        </button>
    `;

    // Insertar los botones dentro del modal de información
    const actionDiv = document.querySelector('.modal-content');
    const existingForm = actionDiv.querySelector('.invest-form');
    if (existingForm) {
        existingForm.remove();
    }
    
    const formDiv = document.createElement('div');
    formDiv.className = 'invest-form';
    formDiv.style.marginTop = '16px';
    formDiv.style.borderTop = '1px solid #E5E7EB';
    formDiv.style.paddingTop = '16px';
    formDiv.innerHTML = html;
    actionDiv.appendChild(formDiv);
}

function selectAmountFromModal(amt, evt) {
    const formDiv = document.querySelector('.invest-form');
    const buttons = formDiv.querySelectorAll('.amount-btn');
    buttons.forEach(b => b.classList.remove('selected'));
    evt.target.classList.add('selected');
    formDiv.querySelector('#customAmount').value = amt;
}

function confirmInvestmentFromModal() {
    const formDiv = document.querySelector('.invest-form');
    const amount = parseInt(formDiv.querySelector('#customAmount').value);
    
    if (!amount || amount <= 0) {
        showToast('❌ Ingresa un monto válido');
        return;
    }

    recordTransaction(investType, currentProject, amount);

    if (investType === 'donate') {
        showToast(`✅ ¡Donaste $${amount} a ${currentProject.title}!`);
    } else {
        showToast(`✅ ¡Invertiste $${amount} en ${currentProject.title}!`);
    }

    // Limpiar el formulario
    const formDiv2 = document.querySelector('.invest-form');
    if (formDiv2) {
        formDiv2.remove();
    }
}

function selectAmount(amt, evt) {
    document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('selected'));
    evt.target.classList.add('selected');
    document.getElementById('customAmount').value = amt;
}

function confirmInvestment() {
    const amount = parseInt(document.getElementById('customAmount').value);
    
    if (!amount || amount <= 0) {
        showToast('❌ Ingresa un monto válido');
        return;
    }

    recordTransaction(investType, currentProject, amount);

    if (investType === 'donate') {
        showToast(`✅ ¡Donaste $${amount} a ${currentProject.title}!`);
    } else {
        showToast(`✅ ¡Invertiste $${amount} en ${currentProject.title}!`);
    }

    closeInvest();
}

function shareProject(id) {
    const p = projects.find(x => x.id === id);
    currentProject = p;
    document.getElementById('shareOptions').innerHTML = renderShareOptions(p);
    document.getElementById('shareSheet').classList.add('active');
}

function closeShare() {
    document.getElementById('shareSheet').classList.remove('active');
}

function renderShareOptions(p) {
    const link = window.location.origin + window.location.pathname + '?project=' + p.id;
    const text = `Apoya "${p.title}" en ÑEKE 🚀`;
    const encodedLink = encodeURIComponent(link);
    const encodedText = encodeURIComponent(text);

    const networks = [
        { name: 'WhatsApp', color: '#25D366', icon: '💬', url: `https://api.whatsapp.com/send?text=${encodedText}%20${encodedLink}` },
        { name: 'Facebook', color: '#1877F2', icon: 'f', url: `https://www.facebook.com/sharer/sharer.php?u=${encodedLink}` },
        { name: 'X', color: '#000000', icon: '𝕏', url: `https://twitter.com/intent/tweet?text=${encodedText}&url=${encodedLink}` },
        { name: 'Telegram', color: '#26A5E4', icon: '✈️', url: `https://t.me/share/url?url=${encodedLink}&text=${encodedText}` },
        { name: 'Email', color: '#6B7280', icon: '✉️', url: `mailto:?subject=${encodeURIComponent(p.title)}&body=${encodedText}%20${encodedLink}` }
    ];

    const networkButtons = networks.map(n => `
        <button type="button" class="share-option" onclick="window.open('${n.url}', '_blank')">
            <span class="share-icon" style="background: ${n.color};">${n.icon}</span>
            ${n.name}
        </button>
    `).join('');

    return networkButtons + `
        <button type="button" class="share-option" onclick="copyShareLink('${link}')">
            <span class="share-icon" style="background: #9CA3AF;">🔗</span>
            Copiar link
        </button>
    `;
}

function copyShareLink(link) {
    navigator.clipboard.writeText(link);
    showToast('🔗 Link copiado');
    closeShare();
}

function openAdmin() {
    document.getElementById('adminModal').classList.add('active');
    showList();
}

function closeAdmin() {
    document.getElementById('adminModal').classList.remove('active');
}

function openProfile() {
    renderProfile();
    document.getElementById('profileModal').classList.add('active');
}

function closeProfile() {
    document.getElementById('profileModal').classList.remove('active');
}

function renderProfile() {
    const donations = currentUser.donations;
    const investments = currentUser.investments;

    const totalDonado = donations.reduce((sum, d) => sum + d.amount, 0);
    const totalInvertido = investments.reduce((sum, i) => sum + i.amount, 0);
    const totalTx = donations.length + investments.length;
    const proyectosApoyados = new Set(
        [...donations, ...investments].map(t => t.projectId)
    ).size;

    const statsHtml = `
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-card-value">$${totalDonado.toLocaleString()}</div>
                <div class="stat-card-label">💝 Total Donado</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-value">$${totalInvertido.toLocaleString()}</div>
                <div class="stat-card-label">💰 Total Invertido</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-value">${totalTx}</div>
                <div class="stat-card-label">📊 Transacciones</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-value">${proyectosApoyados}</div>
                <div class="stat-card-label">🚀 Proyectos Apoyados</div>
            </div>
        </div>
    `;

    if (totalTx === 0) {
        document.getElementById('profileContent').innerHTML = statsHtml + `
            <div class="empty-state">Aún no has donado ni invertido en ningún proyecto.<br>Explora el feed y apoya un emprendimiento 🚀</div>
        `;
        return;
    }

    const total = totalDonado + totalInvertido;
    const pctDonado = total ? Math.round(totalDonado / total * 100) : 0;
    const pctInvertido = total ? 100 - pctDonado : 0;

    const breakdownHtml = `
        <h3 style="margin-bottom: 12px; font-size: 14px;">Distribución por tipo</h3>
        <div class="breakdown-row">
            <div class="breakdown-label">
                <span><span class="dot" style="background: #10B981;"></span>Donaciones</span>
                <span>$${totalDonado.toLocaleString()} (${pctDonado}%)</span>
            </div>
            <div class="breakdown-track">
                <div class="breakdown-fill" style="width: ${pctDonado}%; background: #10B981;"></div>
            </div>
        </div>
        <div class="breakdown-row">
            <div class="breakdown-label">
                <span><span class="dot" style="background: #4F46E5;"></span>Inversiones</span>
                <span>$${totalInvertido.toLocaleString()} (${pctInvertido}%)</span>
            </div>
            <div class="breakdown-track">
                <div class="breakdown-fill" style="width: ${pctInvertido}%; background: #4F46E5;"></div>
            </div>
        </div>
    `;

    const allTx = [
        ...donations.map(d => ({ ...d, type: 'donate' })),
        ...investments.map(i => ({ ...i, type: 'invest' }))
    ].reverse();

    const tableHtml = `
        <h3 style="margin: 20px 0 12px; font-size: 14px;">Historial de transacciones</h3>
        <table class="tx-table">
            <thead>
                <tr>
                    <th>Proyecto</th>
                    <th>Tipo</th>
                    <th>Monto</th>
                    <th>Fecha</th>
                </tr>
            </thead>
            <tbody>
                ${allTx.map(t => `
                    <tr>
                        <td>${t.projectTitle}</td>
                        <td><span class="tx-badge" style="background: ${t.type === 'donate' ? '#10B981' : '#4F46E5'};">${t.type === 'donate' ? 'DONACIÓN' : 'INVERSIÓN'}</span></td>
                        <td>$${t.amount.toLocaleString()}</td>
                        <td>${t.date}</td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;

    document.getElementById('profileContent').innerHTML = statsHtml + breakdownHtml + tableHtml;
}

function showList() {
    const html = projects.map(p => `
        <div class="project-item">
            <span>${p.title}</span>
            <button onclick="deleteProj(${p.id})">Eliminar</button>
        </div>
    `).join('');
    document.getElementById('projectsList').innerHTML = html;
}

function addProject(e) {
    e.preventDefault();
    
    const url = document.getElementById('ytUrl').value;
    const { platform, id } = extractVideoInfo(url);

    if (!id) {
        showToast('❌ URL de video inválida (usa un link completo de YouTube o TikTok)');
        return;
    }

    projects.push({
        id: Date.now(),
        title: document.getElementById('title').value,
        creator: document.getElementById('creator').value,
        category: document.getElementById('category').value,
        platform: platform,
        videoId: id,
        goal: parseInt(document.getElementById('goal').value),
        raised: parseInt(document.getElementById('raised').value),
        days: parseInt(document.getElementById('days').value),
        desc: document.getElementById('desc').value,
        type: document.getElementById('type').value,
        roi: document.getElementById('type').value === 'equity' ? '10-15%' : 'Producto/Donación'
    });
    
    localStorage.setItem('nekeProjects', JSON.stringify(projects));
    e.target.reset();
    document.getElementById('ytStatus').style.display = 'none';
    showList();
    applyFilter();
    showToast('✅ Proyecto agregado');
    closeAdmin();
}

function deleteProj(id) {
    projects = projects.filter(p => p.id !== id);
    localStorage.setItem('nekeProjects', JSON.stringify(projects));
    showList();
    applyFilter();
}

function showToast(msg) {
    let container = document.getElementById('toastContainer');
    if (!container) {
        container = document.createElement('div');
        container.id = 'toastContainer';
        container.className = 'toast-container';
        document.body.appendChild(container);
    }
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    container.appendChild(t);
    setTimeout(() => t.remove(), 2000);
}

applyFilter();
</script>
